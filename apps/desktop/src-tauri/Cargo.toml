[package]
name = "blogbot"
version = "0.1.0"
description = "Local Windows editorial automation for a user-selected site"
authors = ["Blogbot"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "blogbot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
