name: Deploy approved SiberDergi artifact

# This workflow is intentionally manual and environment-gated.  The site
# repository should produce the immutable artifact and pass CI first; this
# workflow only transfers that exact artifact to a pre-configured host.
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Successful GitHub Actions run ID that produced the site artifact"
        required: true
        type: string
      artifact_name:
        description: "Artifact name containing the site tarball"
        required: true
        default: siberdergi-site
        type: string
      release_id:
        description: "Lowercase release identifier (usually the merge SHA)"
        required: true
        type: string
      sha256:
        description: "Expected SHA-256 of the site tarball"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: siberdergi-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy immutable site artifact
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Download the approved artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifact_run_id }}
          name: ${{ inputs.artifact_name }}
          path: deploy-artifact

      - name: Validate deployment inputs
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[a-f0-9]{16,64}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mapfile -t artifacts < <(find deploy-artifact -maxdepth 1 -type f -name '*.tar.gz' -print)
          [[ "${#artifacts[@]}" -eq 1 ]]
          artifact="${artifacts[0]}"
          actual="$(sha256sum "$artifact" | awk '{print $1}')"
          [[ "$actual" == "$EXPECTED_SHA256" ]]
          printf '%s\n' "$artifact" > deploy-artifact/path.txt

      - name: Configure pinned SSH host
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/blogbot-deploy-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/blogbot-known-hosts"

      - name: Transfer and atomically activate the release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
          RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          artifact="$(cat deploy-artifact/path.txt)"
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(-i "$RUNNER_TEMP/blogbot-deploy-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/blogbot-known-hosts")
          scp "${ssh_opts[@]}" "$artifact" "$remote:/tmp/blogbot-${RELEASE_ID}.tar.gz"
          scp "${ssh_opts[@]}" infra/scripts/deploy-release.sh "$remote:/tmp/blogbot-deploy-release.sh"
          ssh "${ssh_opts[@]}" "$remote" "chmod 700 /tmp/blogbot-deploy-release.sh && /tmp/blogbot-deploy-release.sh --artifact /tmp/blogbot-${RELEASE_ID}.tar.gz --sha256 ${EXPECTED_SHA256} --release-id ${RELEASE_ID} --root ${DEPLOY_ROOT} --apply"

      - name: Probe public site after activation
        id: public-health
        continue-on-error: true
        shell: bash
        env:
          SITE_ORIGIN: ${{ secrets.SITE_ORIGIN }}
        run: |
          set -euo pipefail
          [[ "$SITE_ORIGIN" == "https://siberdergi.net" ]]
          for path in /robots.txt /sitemap.xml /news-sitemap.xml /rss.xml /en/rss.xml; do
            curl --fail --silent --show-error --location --max-time 15 --proto '=https' --proto-redir '=https' "$SITE_ORIGIN$path" >/dev/null
          done

      - name: Roll back after failed public health probe
        if: steps.public-health.outcome != 'success'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$RUNNER_TEMP/blogbot-deploy-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/blogbot-known-hosts")
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh "${ssh_opts[@]}" "$remote" "chmod 700 /tmp/blogbot-deploy-release.sh && /tmp/blogbot-deploy-release.sh --root ${DEPLOY_ROOT} --rollback --apply"
          exit 1

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/blogbot-deploy-key" "$RUNNER_TEMP/blogbot-known-hosts"
