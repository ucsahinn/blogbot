name: Release Blogbot Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version to release (for example 0.1.1)"
        required: true
        type: string
      notes:
        description: "Release notes shown by Blogbot"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-blogbot-desktop
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "RELEASE_VERSION_INVALID"
          }
          $desktopManifest = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          if ($desktopManifest.version -ne $env:RELEASE_VERSION) {
            throw "RELEASE_VERSION_MISMATCH: apps/desktop/package.json must equal the requested release version"
          }
      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm.cmd run build:desktop
      - name: Create signed updater manifest
        id: manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $bundle = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if ($null -eq $bundle) { throw "UPDATER_ARCHIVE_MISSING" }
          $signaturePath = "$($bundle.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw "UPDATER_SIGNATURE_MISSING" }
          $signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw "UPDATER_SIGNATURE_EMPTY" }
          $manifest = [ordered]@{
            version = $env:RELEASE_VERSION
            notes = $env:RELEASE_NOTES
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                url = "https://github.com/$($env:REPOSITORY)/releases/download/v$($env:RELEASE_VERSION)/$($bundle.Name)"
                signature = $signature
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath latest.json -Encoding utf8NoBOM
          "archive=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
      - name: Publish signed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          UPDATER_ARCHIVE: ${{ steps.manifest.outputs.archive }}
        run: |
          gh release create "v$env:RELEASE_VERSION" $env:UPDATER_ARCHIVE "$env:UPDATER_ARCHIVE.sig" latest.json --title "Blogbot $env:RELEASE_VERSION" --notes "${{ inputs.notes }}"
