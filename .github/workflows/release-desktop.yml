name: Release OPE Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version to release (for example 0.1.1)"
        required: true
        type: string
      notes:
        description: "Release notes shown by OPE"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-ope-desktop
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "RELEASE_VERSION_INVALID"
          }
          $desktopManifest = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          if ($desktopManifest.version -ne $env:RELEASE_VERSION) {
            throw "RELEASE_VERSION_MISMATCH: apps/desktop/package.json must equal the requested release version"
          }
      - name: Build unsigned desktop installer
        run: npm.cmd run build:desktop
      - name: Create unsigned updater manifest
        id: manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $bundle = Join-Path 'apps/desktop/src-tauri/target/release/bundle/nsis' "OPE_$($env:RELEASE_VERSION)_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) { throw "UPDATER_ARCHIVE_MISSING" }
          $bundle = (Resolve-Path -LiteralPath $bundle).Path
          $sha256 = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $env:RELEASE_VERSION
            notes = $env:RELEASE_NOTES
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                url = "https://github.com/$($env:REPOSITORY)/releases/download/v$($env:RELEASE_VERSION)/$([IO.Path]::GetFileName($bundle))"
                sha256 = $sha256
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath latest.json -Encoding utf8NoBOM
          "archive=$bundle" >> $env:GITHUB_OUTPUT
      - name: Publish unsigned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          UPDATER_ARCHIVE: ${{ steps.manifest.outputs.archive }}
        run: |
          gh release create "v$env:RELEASE_VERSION" $env:UPDATER_ARCHIVE latest.json --title "OPE $env:RELEASE_VERSION" --notes "${{ inputs.notes }}"
